apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: ghcr.io/open-liontechsolution/fintech-personal-web-app:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: webapp-config
              key: db_host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: webapp-config
              key: db_port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: webapp-config
              key: db_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: webapp-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webapp-secrets
              key: db_password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: webapp-secrets
              key: jwt_secret
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: webapp-secrets
              key: rabbitmq_url
        - name: RUN_MIGRATIONS
          value: "true"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
