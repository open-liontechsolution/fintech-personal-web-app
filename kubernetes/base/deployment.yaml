apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-webapp
  labels:
    app: fintech-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fintech-webapp
  template:
    metadata:
      labels:
        app: fintech-webapp
    spec:
      containers:
      - name: fintech-webapp
        image: ghcr.io/open-liontechsolution/fintech-personal-web-app:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        env:
        # Variables de entorno para la base de datos primaria (escritura)
        - name: DB_PRIMARY_HOST
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_primary_host
        # Variable de entorno estándar para compatibilidad con Sequelize
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_primary_host
        # Variables de entorno para la base de datos de lectura
        - name: DB_READ_HOST
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_read_host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_name
        - name: DB_SCHEMA
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_schema
        # Variables adicionales para configuración de PostgreSQL
        - name: POSTGRES_SCHEMA
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: db_schema
        # Credenciales de usuario normal para operaciones regulares de la aplicación
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: fintech-webapp-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fintech-webapp-secrets
              key: db_password
        # Credenciales de usuario admin para migraciones
        - name: DB_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: fintech-webapp-secrets
              key: db_admin_user
        - name: DB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fintech-webapp-secrets
              key: db_admin_password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fintech-webapp-secrets
              key: jwt_secret
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: fintech-webapp-secrets
              key: rabbitmq_url
        # Control de migraciones y sincronización de BD
        - name: DISABLE_DB_SYNC
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: DISABLE_DB_SYNC
        - name: RUN_MIGRATIONS
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: RUN_MIGRATIONS
        - name: RUN_SEEDS
          valueFrom:
            configMapKeyRef:
              name: fintech-webapp-config
              key: RUN_SEEDS
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
