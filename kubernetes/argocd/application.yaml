apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-personal-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/open-liontechsolution/fintech-personal-web-app.git
    targetRevision: develop
    path: kubernetes/overlays/dev
    kustomize:
      images:
      - ghcr.io/open-liontechsolution/fintech-personal-web-app:
  destination:
    server: https://kubernetes.default.svc
    namespace: fintech-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
