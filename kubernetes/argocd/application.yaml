apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-personal-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{REPO_URL}}
    targetRevision: develop
    path: kubernetes/overlays/dev
    kustomize:
      images:
      - ghcr.io/{{REPO_OWNER}}/fintech-personal-web-app:{{IMAGE_TAG}}
  destination:
    server: https://kubernetes.default.svc
    namespace: fintech-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
