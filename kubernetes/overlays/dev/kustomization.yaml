apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fintech-dev
namePrefix: dev-

resources:
  - ../../base

commonLabels:
  environment: development

patches:
  - path: replica-count.yaml
  - path: resources.yaml
  - path: env-config.yaml

configMapGenerator:
  - name: fintech-webapp-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DISABLE_DB_SYNC=false

images:
  - name: ghcr.io/open-liontechsolution/fintech-personal-web-app
    newName: ghcr.io/open-liontechsolution/fintech-personal-web-app
    newTag: 
