apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-webapp
spec:
  template:
    spec:
      containers:
        - name: fintech-webapp
          # Reemplazar todas las variables de entorno para evitar conflictos
          env:
            # Variables desde ConfigMap
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: LOG_LEVEL
            - name: DISABLE_DB_SYNC
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: DISABLE_DB_SYNC
            # Puerto fijo
            - name: PORT
              value: "3000"
            # Variables para la conexión a PostgreSQL (primario y lectura)
            - name: DB_PRIMARY_HOST
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_primary_host
            # Variable estándar para compatibilidad con Sequelize
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_primary_host
            - name: DB_READ_HOST
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_read_host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_name
            - name: DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_schema
            # Variable adicional para configuración de PostgreSQL
            - name: POSTGRES_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: db_schema
            # Migraciones
            - name: RUN_MIGRATIONS
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: RUN_MIGRATIONS
            - name: RUN_SEEDS
              valueFrom:
                configMapKeyRef:
                  name: fintech-webapp-config
                  key: RUN_SEEDS
