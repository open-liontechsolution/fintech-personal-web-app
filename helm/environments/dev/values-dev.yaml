# Dev environment values for fintech-webapp.
# These values override the default ones from values.yaml

replicaCount: 1

image:
  tag: "dev-c634a7f"
  pullPolicy: Always

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  # Use development environment configuration
  nodeEnv: "development"
  logLevel: "debug"
  # Database configuration for dev environment
  dbPrimaryHost: "postgresql-primary.generic.svc.cluster.local"
  dbReadHost: "postgresql-read.generic.svc.cluster.local"
  dbName: "fintech_db"
  dbSchema: "fintech"
  # Siempre deshabilitar la sincronización automática y usar Jobs en su lugar
  disableDbSync: "true"
  runMigrations: "false"  # Ya no se usa, reemplazado por Jobs
  runSeeds: "false"      # Ya no se usa, reemplazado por Jobs
  # RabbitMQ Configuration
  rabbitmqExchange: "file-upload-exchange"
  rabbitmqQueue: "file-import-queue"
  rabbitmqRoutingKey: "file.uploaded"
  rabbitmqExchangeType: "topic"

# Habilitar Jobs de migraciones para entorno dev
migrations:
  enabled: true            # Habilitar migraciones automáticas en dev
  runSeeds: false          # Desactivar seeds para evitar datos ficticios
  backoffLimit: 3          # Número máximo de reintentos
  activeDeadlineSeconds: 900  # 15 minutos como máximo para completar (más tiempo en dev)

# Los secrets no se incluyen aquí por razones de seguridad
# Están definidos en archivos separados en el directorio /helm/secrets
# Usar el archivo secrets-dev.yaml para el entorno de desarrollo

# Development environment might have specific network policy requirements
postgresNetworkPolicy:
  namespace: "generic"

# Configuración del sidecar frpc para el entorno de desarrollo
frpc:
  enabled: true  # Habilitar frpc en entorno de desarrollo
  # Los datos encriptados del secret se obtienen del archivo frpc-sealedsecret-dev.yaml
