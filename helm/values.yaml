# Default values for fintech-webapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Nombre de la aplicación usado para nombrar los recursos
appName: "fintech-webapp"

replicaCount: 2

image:
  repository: ghcr.io/open-liontechsolution/fintech-personal-web-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

containerPort: 3000

nameOverride: ""
fullnameOverride: ""
appPartOf: "fintech-personal"

service:
  type: ClusterIP
  port: 80
  # nodePort: 30000 # Only used if service.type is NodePort

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

config:
  dbPrimaryHost: "postgresql-primary.generic.svc.cluster.local"
  dbReadHost: "postgresql-read.generic.svc.cluster.local"
  dbPort: "5432"
  dbName: "fintech_db"
  dbSchema: "fintech"
  nodeEnv: "production"
  # logLevel: "info"
  disableDbSync: "true"  # Siempre deshabilitar la sincronización automática
  runMigrations: "false"  # Ya no se usa, reemplazado por Jobs
  runSeeds: "false"      # Ya no se usa, reemplazado por Jobs

# Configuración para los Jobs de migraciones
migrations:
  enabled: true  # Habilitado para recrear las tablas con el usuario correcto
  runSeeds: false  # Por defecto no ejecutar semillas
  backoffLimit: 3   # Número máximo de reintentos
  activeDeadlineSeconds: 600  # 10 minutos como máximo para completar
  ttlSecondsAfterFinished: 3600  # Eliminar el job después de 1 hora
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Los secrets no se incluyen aquí por razones de seguridad
# Están definidos en archivos separados en el directorio /secrets
# que no deben ser subidos al control de versiones

postgresNetworkPolicy:
  namespace: "generic"

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
