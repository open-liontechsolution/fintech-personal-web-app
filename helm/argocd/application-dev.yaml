apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-webapp-dev
  namespace: argocd
spec:
  project: fintech-dev
  source:
    repoURL: https://github.com/open-liontechsolution/fintech-personal-web-app.git
    targetRevision: develop
    path: helm
    helm:
      valueFiles:
        - environments/dev/values-dev.yaml
        - environments/dev/sealedsecrets-values.yaml
        - environments/dev/sealedsecrets-frpc.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fintech-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
