name: Development Pipeline

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'kubernetes/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_ENVIRONMENT: dev
  NAMESPACE: fintech-dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      - name: Install ESLint dependencies only
        run: |
          npm install --no-save eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser typescript
          # Copiar los node_modules instalados a un directorio para cache rápido
          cp -r node_modules node_modules_eslint

      - name: Lint code
        run: npm run lint
        
      - name: Install full dependencies
        run: npm ci
        # Esto solo se ejecutará si el linting ha pasado correctamente
  
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Añadir outputs para que el tag de imagen esté disponible para otros jobs
    outputs:
      IMAGE_TAG: ${{ steps.imagetag.outputs.IMAGE_TAG }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Agregar configuración de Node.js y npm para Dockerfile
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      # Configurar .npmrc para que Docker lo use durante la construcción
      - name: Configure npm
        run: |
          echo "registry=https://verdaccio.liontechsolution.com/" > .npmrc
          echo "always-auth=false" >> .npmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: imagetag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old container images
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const packageName = repo.toLowerCase();
            
            // Obtener todas las versiones de la imagen
            const response = await github.request('GET /users/{owner}/packages/container/{package_name}/versions', {
              owner: owner,
              package_name: packageName,
              per_page: 100
            });
            
            // Filtrar por las versiones que comienzan con "dev-"
            const devVersions = response.data
              .filter(version => {
                return version.metadata.container.tags.some(tag => tag.startsWith('dev-'));
              })
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            console.log(`Encontradas ${devVersions.length} versiones de desarrollo`);
            
            // Conservar las 2 últimas versiones y eliminar el resto
            if (devVersions.length > 2) {
              const versionsToDelete = devVersions.slice(2);
              console.log(`Se eliminarán ${versionsToDelete.length} versiones antiguas`);
              
              for (const version of versionsToDelete) {
                try {
                  await github.request('DELETE /users/{owner}/packages/container/{package_name}/versions/{version_id}', {
                    owner: owner,
                    package_name: packageName,
                    version_id: version.id
                  });
                  console.log(`Eliminada versión ${version.id}`);
                } catch (error) {
                  console.error(`Error al eliminar la versión ${version.id}: ${error}`);
                }
              }
            } else {
              console.log('No hay versiones antiguas para eliminar');
            }

  update-argocd-dev:
    needs: [build-and-push, cleanup-old-images]
    runs-on: ubuntu-latest
    # Añadir permisos de escritura para permitir push al repositorio
    permissions:
      contents: write
    outputs:
      image_tag: ${{ steps.imagetag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Get image tag from previous job
        id: imagetag
        run: |
          # Obtener la etiqueta directamente del job build-and-push
          IMAGE_TAG="${{ needs.build-and-push.outputs.IMAGE_TAG }}"
          
          # Verificar que la etiqueta no esté vacía
          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: No se pudo obtener IMAGE_TAG del job build-and-push"
            # Intentar obtener la etiqueta de la variable de entorno como respaldo
            IMAGE_TAG="${{ env.IMAGE_TAG }}"
            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: Tampoco se pudo obtener IMAGE_TAG de las variables de entorno"
              exit 1
            fi
            echo "Usando etiqueta de respaldo: $IMAGE_TAG"
          else
            echo "Usando etiqueta del job build-and-push: $IMAGE_TAG"
          fi
          
          # Establecer la etiqueta para los siguientes pasos
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ArgoCD application manifest
        run: |
          # Actualizar la versión de la imagen en el manifiesto de ArgoCD
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REPO_OWNER="${{ github.repository_owner }}"
          IMAGE_TAG="${{ steps.imagetag.outputs.IMAGE_TAG }}"
          
          # Reemplazar placeholders en el archivo application.yaml
          sed -i "s|{{REPO_URL}}|${REPO_URL}|g" kubernetes/argocd/application.yaml
          sed -i "s|{{REPO_OWNER}}|${REPO_OWNER}|g" kubernetes/argocd/application.yaml
          sed -i "s|{{IMAGE_TAG}}|${IMAGE_TAG}|g" kubernetes/argocd/application.yaml
          
          # También actualizar la imagen en el kustomization de desarrollo
          if [ -f "kubernetes/overlays/dev/kustomization.yaml" ]; then
            # Verificar que IMAGE_TAG no esté vacío antes de actualizar
            if [ -n "${IMAGE_TAG}" ]; then
              # Usar una expresión sed más precisa para asegurar que newTag tenga un valor
              sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|g" kubernetes/overlays/dev/kustomization.yaml
              # Verificar que se haya actualizado correctamente
              grep "newTag:" kubernetes/overlays/dev/kustomization.yaml
            else
              echo "ERROR: Variable IMAGE_TAG está vacía. No se actualizará el archivo kustomization.yaml"
              exit 1
            fi
          fi
          
          # Confirmar y subir los cambios
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add kubernetes/argocd/application.yaml
          
          if [ -f "kubernetes/overlays/dev/kustomization.yaml" ]; then
            git add kubernetes/overlays/dev/kustomization.yaml
          fi
          
          git commit -m "Update ArgoCD configuration for image tag ${IMAGE_TAG}"
          git push origin develop
          
      - name: Wait for ArgoCD sync
        run: |
          echo "Los cambios han sido enviados al repositorio. ArgoCD sincronizará automáticamente los cambios."
          echo "Puedes verificar el estado del despliegue en la UI de ArgoCD."
