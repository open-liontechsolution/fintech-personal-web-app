name: Development Pipeline

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - 'kubernetes/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_ENVIRONMENT: dev
  NAMESPACE: fintech-dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      # Configurar .npmrc optimizado para CI
      - name: Configure npm
        run: |
          echo "registry=https://verdaccio.liontechsolution.com/" > .npmrc
          echo "always-auth=false" >> .npmrc
          echo "fetch-retries=5" >> .npmrc
          echo "fetch-retry-factor=2" >> .npmrc
          echo "fetch-retry-mintimeout=10000" >> .npmrc
          echo "fetch-retry-maxtimeout=60000" >> .npmrc

      # Descargar y instalar manualmente el paquete problemático
      - name: Fix problematic package
        run: |
          # Crear directorio node_modules si no existe
          mkdir -p node_modules
          
          # Descargar el paquete directamente del registro público
          cd /tmp
          npm pack yocto-queue@0.1.0 --registry=https://registry.npmjs.org/
          
          # Descomprimir el paquete
          mkdir -p yocto-queue
          tar -xzf yocto-queue-0.1.0.tgz -C yocto-queue --strip-components=1
          
          # Copiar el paquete a node_modules
          cd $GITHUB_WORKSPACE
          mkdir -p node_modules/yocto-queue
          cp -R /tmp/yocto-queue/* node_modules/yocto-queue/
          
          # Verificar que el paquete se ha instalado correctamente
          if [ -f "node_modules/yocto-queue/package.json" ]; then
            echo "✅ Paquete yocto-queue instalado manualmente con éxito"
          else
            echo "❌ Error al instalar yocto-queue manualmente"
            exit 1
          fi

      # Modificar package-lock.json para evitar que npm intente descargar yocto-queue
      - name: Fix package-lock.json
        run: |
          # Hacer una copia de seguridad
          cp package-lock.json package-lock.json.bak
          
          # Intentar modificar las referencias a yocto-queue en package-lock.json
          sed -i 's|"resolved": "https://verdaccio.liontechsolution.com/yocto-queue/-/yocto-queue-.*"|"resolved": "https://registry.npmjs.org/yocto-queue/-/yocto-queue-0.1.0.tgz"|g' package-lock.json
          
          # Verificar que se ha modificado
          grep -q "registry.npmjs.org/yocto-queue" package-lock.json
          if [ $? -eq 0 ]; then
            echo "✅ package-lock.json modificado correctamente"
          else
            echo "⚠️ No se pudo modificar package-lock.json, pero continuamos con la instalación"
          fi

      - name: Install dependencies
        run: |
          # Usar --no-package-lock para evitar que npm actualice el package-lock.json
          npm ci --no-package-lock || npm ci --no-package-lock --force

      - name: Lint code
        run: npm run lint
  
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      # Configurar .npmrc optimizado para CI
      - name: Configure npm
        run: |
          echo "registry=https://verdaccio.liontechsolution.com/" > .npmrc
          echo "always-auth=false" >> .npmrc
          echo "fetch-retries=5" >> .npmrc
          echo "fetch-retry-factor=2" >> .npmrc
          echo "fetch-retry-mintimeout=10000" >> .npmrc
          echo "fetch-retry-maxtimeout=60000" >> .npmrc

      # Descargar y instalar manualmente el paquete problemático
      - name: Fix problematic package
        run: |
          # Crear directorio node_modules si no existe
          mkdir -p node_modules
          
          # Descargar el paquete directamente del registro público
          cd /tmp
          npm pack yocto-queue@0.1.0 --registry=https://registry.npmjs.org/
          
          # Descomprimir el paquete
          mkdir -p yocto-queue
          tar -xzf yocto-queue-0.1.0.tgz -C yocto-queue --strip-components=1
          
          # Copiar el paquete a node_modules
          cd $GITHUB_WORKSPACE
          mkdir -p node_modules/yocto-queue
          cp -R /tmp/yocto-queue/* node_modules/yocto-queue/
          
          # Verificar que el paquete se ha instalado correctamente
          if [ -f "node_modules/yocto-queue/package.json" ]; then
            echo "✅ Paquete yocto-queue instalado manualmente con éxito"
          else
            echo "❌ Error al instalar yocto-queue manualmente"
            exit 1
          fi

      # Modificar package-lock.json para evitar que npm intente descargar yocto-queue
      - name: Fix package-lock.json
        run: |
          # Hacer una copia de seguridad
          cp package-lock.json package-lock.json.bak
          
          # Intentar modificar las referencias a yocto-queue en package-lock.json
          sed -i 's|"resolved": "https://verdaccio.liontechsolution.com/yocto-queue/-/yocto-queue-.*"|"resolved": "https://registry.npmjs.org/yocto-queue/-/yocto-queue-0.1.0.tgz"|g' package-lock.json
          
          # Verificar que se ha modificado
          grep -q "registry.npmjs.org/yocto-queue" package-lock.json
          if [ $? -eq 0 ]; then
            echo "✅ package-lock.json modificado correctamente"
          else
            echo "⚠️ No se pudo modificar package-lock.json, pero continuamos con la instalación"
          fi

      - name: Install dependencies
        run: |
          # Usar --no-package-lock para evitar que npm actualice el package-lock.json
          npm ci --no-package-lock || npm ci --no-package-lock --force

      - name: Run tests
        run: npm test
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Configuración de Node.js para Dockerfile
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      # Configurar .npmrc optimizado para CI
      - name: Configure npm
        run: |
          echo "registry=https://verdaccio.liontechsolution.com/" > .npmrc
          echo "always-auth=false" >> .npmrc
          echo "fetch-retries=5" >> .npmrc
          echo "fetch-retry-factor=2" >> .npmrc
          echo "fetch-retry-mintimeout=10000" >> .npmrc
          echo "fetch-retry-maxtimeout=60000" >> .npmrc

      # Para Docker build también necesitamos modificar las referencias en package-lock.json
      - name: Fix package-lock.json for Docker build
        run: |
          # Hacer una copia de seguridad
          cp package-lock.json package-lock.json.bak
          
          # Intentar modificar las referencias a yocto-queue en package-lock.json
          sed -i 's|"resolved": "https://verdaccio.liontechsolution.com/yocto-queue/-/yocto-queue-.*"|"resolved": "https://registry.npmjs.org/yocto-queue/-/yocto-queue-0.1.0.tgz"|g' package-lock.json
          
          # Verificar que se ha modificado
          grep -q "registry.npmjs.org/yocto-queue" package-lock.json
          if [ $? -eq 0 ]; then
            echo "✅ package-lock.json modificado correctamente"
          else
            echo "⚠️ No se pudo modificar package-lock.json, pero continuamos con la construcción"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: imagetag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-old-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old container images
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const packageName = repo.toLowerCase();
            
            // Obtener todas las versiones de la imagen
            const response = await github.request('GET /users/{owner}/packages/container/{package_name}/versions', {
              owner: owner,
              package_name: packageName,
              per_page: 100
            });
            
            // Filtrar por las versiones que comienzan con "dev-"
            const devVersions = response.data
              .filter(version => {
                return version.metadata.container.tags.some(tag => tag.startsWith('dev-'));
              })
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            console.log(`Encontradas ${devVersions.length} versiones de desarrollo`);
            
            // Conservar las 2 últimas versiones y eliminar el resto
            if (devVersions.length > 2) {
              const versionsToDelete = devVersions.slice(2);
              console.log(`Se eliminarán ${versionsToDelete.length} versiones antiguas`);
              
              for (const version of versionsToDelete) {
                try {
                  await github.request('DELETE /users/{owner}/packages/container/{package_name}/versions/{version_id}', {
                    owner: owner,
                    package_name: packageName,
                    version_id: version.id
                  });
                  console.log(`Eliminada versión ${version.id}`);
                } catch (error) {
                  console.error(`Error al eliminar la versión ${version.id}: ${error}`);
                }
              }
            } else {
              console.log('No hay versiones antiguas para eliminar');
            }

  update-argocd-dev:
    needs: [build-and-push, cleanup-old-images]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.imagetag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Get image tag from previous job
        id: imagetag
        run: |
          echo "IMAGE_TAG=${{ needs.build-and-push.outputs.IMAGE_TAG || env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Update ArgoCD application manifest
        run: |
          # Actualizar la versión de la imagen en el manifiesto de ArgoCD
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REPO_OWNER="${{ github.repository_owner }}"
          IMAGE_TAG="${{ steps.imagetag.outputs.IMAGE_TAG }}"
          
          # Reemplazar placeholders en el archivo application.yaml
          sed -i "s|{{REPO_URL}}|${REPO_URL}|g" kubernetes/argocd/application.yaml
          sed -i "s|{{REPO_OWNER}}|${REPO_OWNER}|g" kubernetes/argocd/application.yaml
          sed -i "s|{{IMAGE_TAG}}|${IMAGE_TAG}|g" kubernetes/argocd/application.yaml
          
          # También actualizar la imagen en el kustomization de desarrollo
          if [ -f "kubernetes/overlays/dev/kustomization.yaml" ]; then
            sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|g" kubernetes/overlays/dev/kustomization.yaml
          fi
          
          # Confirmar y subir los cambios
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add kubernetes/argocd/application.yaml
          
          if [ -f "kubernetes/overlays/dev/kustomization.yaml" ]; then
            git add kubernetes/overlays/dev/kustomization.yaml
          fi
          
          git commit -m "Update ArgoCD configuration for image tag ${IMAGE_TAG}"
          git push origin develop
          
      - name: Wait for ArgoCD sync
        run: |
          echo "Los cambios han sido enviados al repositorio. ArgoCD sincronizará automáticamente los cambios."
          echo "Puedes verificar el estado del despliegue en la UI de ArgoCD."
