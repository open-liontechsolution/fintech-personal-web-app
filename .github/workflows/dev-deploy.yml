name: Development Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_ENVIRONMENT: dev
  NAMESPACE: fintech-dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
  
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: imagetag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-argocd-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout kubernetes config repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository_owner }}/fintech-personal-k8s
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: fintech-personal-k8s

      - name: Update image version in ArgoCD app
        run: |
          cd fintech-personal-k8s
          
          # Actualizar la versión de la imagen en el overlay de desarrollo
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.IMAGE_TAG }}|g" apps/webapp/overlays/dev/kustomization.yaml
          
          # Confirmar y subir los cambios
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add apps/webapp/overlays/dev/kustomization.yaml
          git commit -m "Update webapp dev image to ${{ needs.build-and-push.outputs.IMAGE_TAG }}"
          git push
          
      - name: Wait for ArgoCD sync
        run: |
          echo "Los cambios han sido enviados al repositorio de infraestructura. ArgoCD sincronizará automáticamente los cambios."
          echo "Puedes verificar el estado del despliegue en la UI de ArgoCD."
