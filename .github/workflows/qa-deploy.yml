name: QA Pipeline

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Type of release (minor/major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_ENVIRONMENT: qa
  NAMESPACE: fintech-qa

jobs:
  determine-release-type:
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.set-type.outputs.release_type }}
      version: ${{ steps.set-type.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Determine release type and version
        id: set-type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TYPE="${{ github.event.inputs.releaseType }}"
          elif [[ "${{ github.ref }}" =~ release/v([0-9]+)\.0\.0 ]]; then
            RELEASE_TYPE="major"
          else
            RELEASE_TYPE="minor"
          fi
          
          # Obtener la última versión etiquetada
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          # Extraer los componentes de la versión
          MAJOR=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
          MINOR=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
          PATCH=$(echo $LATEST_TAG | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
          
          if [[ "$RELEASE_TYPE" == "major" ]]; then
            NEW_VERSION="v$((MAJOR + 1)).0.0"
          else
            NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0"
          fi
          
          echo "release_type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          
          echo "Release type: ${RELEASE_TYPE}"
          echo "New version: ${NEW_VERSION}"

  validate-and-test:
    runs-on: ubuntu-latest
    needs: determine-release-type
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://verdaccio.liontechsolution.com/'

      - name: Install dependencies
        run: npm ci

      - name: Run standard linting
        run: npm run lint

      - name: Run standard tests
        run: npm test

      - name: Run extended tests for major release
        if: needs.determine-release-type.outputs.release_type == 'major'
        run: |
          echo "Running extended test suite for MAJOR release"
          # Añadir aquí pruebas adicionales para major releases
          # Por ejemplo: npm run test:e2e

  build-and-push:
    needs: [determine-release-type, validate-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.imagetag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: imagetag
        run: |
          VERSION=${{ needs.determine-release-type.outputs.version }}
          RELEASE_TYPE=${{ needs.determine-release-type.outputs.release_type }}
          IMAGE_TAG="qa-${VERSION}-${RELEASE_TYPE}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-argocd-qa:
    needs: [determine-release-type, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout kubernetes config repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository_owner }}/fintech-personal-k8s
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: fintech-personal-k8s

      - name: Update image version in ArgoCD app
        run: |
          cd fintech-personal-k8s
          
          # Actualizar la versión de la imagen en el overlay de QA
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}|g" apps/webapp/overlays/qa/kustomization.yaml
          
          # Si es un major release, establecer la estrategia de despliegue blue/green
          if [ "${{ needs.determine-release-type.outputs.release_type }}" == "major" ]; then
            echo "Configurando despliegue blue/green para major release"
            # Aquí se pueden configurar opciones adicionales para un despliegue blue/green
            # Por ejemplo, actualizar un ConfigMap de ArgoCD con parámetros específicos
          fi
          
          # Confirmar y subir los cambios
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add apps/webapp/overlays/qa/kustomization.yaml
          git commit -m "Update webapp QA image to ${{ needs.build-and-push.outputs.image_tag }} (${{ needs.determine-release-type.outputs.release_type }} release)"
          git push

      - name: Update env/qa branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Crear o actualizar la rama env/qa
          git checkout -B env/qa
          
          # Guardar información sobre esta release
          echo "# QA Environment" > QA_RELEASE.md
          echo "Version: ${{ needs.determine-release-type.outputs.version }}" >> QA_RELEASE.md
          echo "Type: ${{ needs.determine-release-type.outputs.release_type }}" >> QA_RELEASE.md
          echo "Image Tag: ${{ needs.build-and-push.outputs.image_tag }}" >> QA_RELEASE.md
          echo "Deployed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> QA_RELEASE.md
          
          git add QA_RELEASE.md
          git commit -m "Update QA environment to ${{ needs.determine-release-type.outputs.version }}"
          git push -f origin env/qa

  create-release-notes:
    needs: [determine-release-type, deploy-to-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          # Obtener la última versión etiquetada
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          # Generar notas de cambios
          if [[ "${{ needs.determine-release-type.outputs.release_type }}" == "major" ]]; then
            TITLE="🚀 Major Release ${{ needs.determine-release-type.outputs.version }} (QA)"
            echo "### Breaking Changes" > release_notes.md
            echo "" >> release_notes.md
            echo "### New Features" >> release_notes.md
            echo "" >> release_notes.md
          else
            TITLE="📦 Minor Release ${{ needs.determine-release-type.outputs.version }} (QA)"
            echo "### New Features" > release_notes.md
            echo "" >> release_notes.md
          fi
          
          echo "### Changes since $LATEST_TAG" >> release_notes.md
          git log --pretty=format:"* %s" $LATEST_TAG...HEAD >> release_notes.md
          
          echo "Release notes generated for ${{ needs.determine-release-type.outputs.version }}"
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.determine-release-type.outputs.version }}-qa
          name: ${{ needs.determine-release-type.outputs.version }} (QA)
          body_path: release_notes.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
