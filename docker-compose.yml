services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=fintech_user
      - DB_PASSWORD=fintech_password
      - DB_NAME=fintech_personal
      - DB_SCHEMA=fintech
      - JWT_SECRET=your_jwt_secret_key_for_development
      - JWT_EXPIRES_IN=1d
      - RABBITMQ_URL=amqp://rabbitmq
      - RUN_MIGRATIONS=true
      - RUN_SEEDS=true
      - SEED_TEST_DATA=true
      - DISABLE_DB_SYNC=true
      - FORCE_DB_SYNC=true
      - IS_CLUSTER=false
      - LOG_LEVEL=info
    depends_on:
      - db
      - rabbitmq
    restart: unless-stopped
    networks:
      - fintech-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=fintech_personal
      - POSTGRES_USER=fintech_user
      - POSTGRES_PASSWORD=fintech_password
    # Sin volumen para evitar persistencia de datos
    # Usar tmpfs para almacenamiento en memoria que se limpia automáticamente
    tmpfs: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fintech-network
    command: -c 'max_connections=100' -c 'shared_buffers=256MB'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    # Sin volumen para evitar persistencia de datos
    networks:
      - fintech-network
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

networks:
  fintech-network:
    driver: bridge

# Se eliminan los volúmenes para evitar persistencia
