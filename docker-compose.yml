services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - APP_URL=http://localhost:3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=fintech_user
      - DB_PASSWORD=fintech_password
      - DB_NAME=fintech_personal
      - DB_SCHEMA=fintech
      - JWT_SECRET=your_jwt_secret_key_for_development
      - JWT_EXPIRES_IN=1d
      - RABBITMQ_URL=amqp://rabbitmq
      - RABBITMQ_EXCHANGE=file-upload-exchange
      - RABBITMQ_QUEUE=file-import-queue
      - RABBITMQ_ROUTING_KEY=file.uploaded
      - MONGODB_URI=mongodb://mongodb:27017/fintech_files
      - RUN_MIGRATIONS=true
      - RUN_SEEDS=true
      - SEED_TEST_DATA=true
      - DISABLE_DB_SYNC=true
      - FORCE_DB_SYNC=false
      - IS_CLUSTER=false
      - LOG_LEVEL=info
      # Email configuration (loaded from .env file)
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      - db
      - rabbitmq
      - mongodb
    restart: unless-stopped
    networks:
      - fintech-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=fintech_personal
      - POSTGRES_USER=fintech_user
      - POSTGRES_PASSWORD=fintech_password
    # Sin volumen para evitar persistencia de datos
    # Usar tmpfs para almacenamiento en memoria que se limpia automáticamente
    tmpfs: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fintech-network
    command: -c 'max_connections=100' -c 'shared_buffers=256MB'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    # Sin volumen para evitar persistencia de datos
    networks:
      - fintech-network
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    # Sin volumen para evitar persistencia de datos
    tmpfs: /data/db
    networks:
      - fintech-network
    environment:
      - MONGO_INITDB_DATABASE=fintech_files

  data-import:
    build:
      context: ../fintech-personal-data-import
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/fintech_files
      - MONGODB_DB_NAME=fintech_files
      - RABBITMQ_URL=amqp://rabbitmq
      - RABBITMQ_EXCHANGE=file-upload-exchange
      - RABBITMQ_EXCHANGE_TYPE=topic
      - RABBITMQ_QUEUE=file-import-queue
      - RABBITMQ_ROUTING_KEY=file.uploaded
      - RABBITMQ_ERROR_QUEUE=file-import-error-queue
      - RABBITMQ_ERROR_ROUTING_KEY=file.import.error
      - RABBITMQ_STATUS_ROUTING_KEY=file.import.status
      - MAX_CONCURRENT_PROCESSING=3
      - DELETE_AFTER_PROCESSING=true
      - TEMP_FILES_DIR=/app/tmp
      - LOG_LEVEL=info
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - rabbitmq
    restart: unless-stopped
    tmpfs:
      - /app/tmp
    networks:
      - fintech-network

networks:
  fintech-network:
    driver: bridge

# Se eliminan los volúmenes para evitar persistencia
